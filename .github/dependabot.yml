version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-three:
        patterns:
          - "@react-three/*"
          - "three"
          - "three-stdlib"
          - "n8ao"
      tooling:
        patterns:
          - "typescript*"
          - "vite"
          - "vitest"
          - "eslint*"
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
